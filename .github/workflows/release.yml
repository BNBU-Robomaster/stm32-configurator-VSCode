name: Release VSIX
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm test
      - run: npm run test:legacy
      - run: npm run package
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
          body: |
            STM32 Flash Configurator — install the VSIX through VS Code's Extensions menu.
            F5: build and debug. Ctrl+F5: build, program, verify, run and exit OpenOCD.
            Based on STM32 Debug Configurator by 左岚, MIT licensed.
